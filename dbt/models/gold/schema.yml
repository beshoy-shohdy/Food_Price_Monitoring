version: 2

models:
  - name: dim_category
    columns:
      - name: category_id
        tests:
          - unique
          - not_null

  - name: dim_product
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_name
        tests:
          - not_null

  - name: dim_source
    columns:
      - name: source_id
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_id
        tests:
          - unique
          - not_null

  - name: fact_price
    columns:
      - name: price_sk
        tests:
          - unique
          - not_null
      - name: price
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: source_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_source')
              field: source_id
      - name: date_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id